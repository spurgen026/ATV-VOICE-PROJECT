name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # llama-cpp-python has no prebuilt wheel for every platform/version
      # combo and may build from source - cmake/build-essential cover that.
      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/resort_atv_voice

      # Model-loading tests are marked @pytest.mark.slow and skipped by
      # default (see tests/conftest.py) - they'd need multi-GB model
      # downloads and, for the router/GPU paths, hardware this runner
      # doesn't have. Only the fast, pure-logic suite runs in CI.
      - name: Run test suite
        run: pytest tests/ -v
