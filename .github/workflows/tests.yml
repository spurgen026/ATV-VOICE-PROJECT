name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # llama-cpp-python has no prebuilt wheel for every platform/version
      # combo and may build from source - cmake/build-essential cover that.
      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # openwakeword==0.6.0 unconditionally depends on tflite-runtime on
      # Linux (platform_system == "Linux" marker), which has no wheel for
      # this runner's Python/platform combo - a real Linux-only gap this
      # workflow caught, invisible on the Windows dev machine. This
      # project only uses openWakeWord's ONNX backend, so tflite-runtime
      # isn't actually needed - install openwakeword with --no-deps plus
      # its real (non-tflite) dependencies instead, then the rest of
      # requirements.txt normally. requirements.txt itself is untouched -
      # this is CI-only, doesn't affect local Windows development.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps openwakeword==0.6.0
          pip install onnxruntime tqdm scipy scikit-learn requests
          grep -v '^openwakeword' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/resort_atv_voice

      # Model-loading tests are marked @pytest.mark.slow and skipped by
      # default (see tests/conftest.py) - they'd need multi-GB model
      # downloads and, for the router/GPU paths, hardware this runner
      # doesn't have. Only the fast, pure-logic suite runs in CI.
      - name: Run test suite
        run: pytest tests/ -v
